name: Build

# Every push to main builds Windows installers you can grab from the run's
# "Artifacts" section. Publishing a release (tag like v0.2.0) builds again and
# attaches the files, plus latest.json, which the in-app updater reads.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Updates are signed so the app only installs builds made here. Without
      # the signing key secret the build still works, just without self-update files.
      - name: Signing setup
        id: sign
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not set, so this build can't be used for auto-updates."
            echo "args=--config src-tauri/tauri.no-updater.conf.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Downtime ${{ github.ref_name }}
          releaseBody: |
            **Downtime-portable.exe** runs without installing.
            **Downtime_…_x64-setup.exe** installs it with a Start menu shortcut. The installed version updates itself.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ steps.sign.outputs.args }}

      - name: Build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: npm run tauri build -- ${{ steps.sign.outputs.args }}

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/downtime.exe out/Downtime-portable.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/

      - name: Attach portable exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" out/Downtime-portable.exe --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: Downtime-windows
          path: out/*
          if-no-files-found: error
